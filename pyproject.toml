[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reseller-api"
version = "1.0.0"
description = "Reseller API client and Telegram Stars shop bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-telegram-bot[job-queue]>=21.6",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
reseller = "reseller_api.cli:main"
cheap4u-bot = "bot.app:main"
cheap4u-dashboard = "dashboard.app:main"

[tool.setuptools.packages.find]
include = ["reseller_api*", "bot*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
